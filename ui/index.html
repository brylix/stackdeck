<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stackdeck</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Stackdeck</h1>
      <p class="sub">Local PHP · MariaDB · Caddy — loopback only</p>
    </header>

    <main>
      <section aria-labelledby="setup-h" class="setup">
        <h2 id="setup-h">Setup</h2>
        <ul id="setup" class="list">
          <li class="empty">Checking…</li>
        </ul>
        <p class="hint">First run: install each service, then set it up. Credentials are generated for you.</p>
      </section>

      <section aria-labelledby="running-h">
        <h2 id="running-h">Running</h2>
        <ul id="running" class="list">
          <li class="empty">Nothing running.</li>
        </ul>
        <button id="refresh" type="button">Refresh</button>
      </section>

      <section aria-labelledby="start-h">
        <h2 id="start-h">Start a process</h2>
        <form id="start-form">
          <label>Preset
            <select name="preset" id="preset">
              <option value="">— choose —</option>
              <option value="mariadb">MariaDB</option>
              <option value="phpmyadmin">phpMyAdmin (127.0.0.1:8081)</option>
              <option value="php-8.5">PHP 8.5 FPM (latest)</option>
              <option value="php-8.3">PHP 8.3 FPM</option>
              <option value="php-8.1">PHP 8.1 FPM (legacy)</option>
            </select>
          </label>
          <label>Name <input name="name" value="mariadb" required /></label>
          <label>Program <input name="program" value="/opt/homebrew/opt/mariadb/bin/mariadbd" required /></label>
          <label>Args <input name="args" value='--datadir="/Users/cyasitha/Library/Application Support/Stackdeck/data" --port=3306 --socket=/tmp/stackdeck.sock' /></label>
          <button type="submit">Start</button>
        </form>
        <p id="msg" class="msg" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
