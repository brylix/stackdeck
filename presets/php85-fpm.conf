; Stackdeck FPM pool — PHP 8.5 (latest)
; One pool per version, each on its own unix socket so versions coexist and
; nothing is exposed on TCP.

[global]
pid = /Users/cyasitha/Library/Application Support/Stackdeck/run/php85-fpm.pid
error_log = /Users/cyasitha/Library/Application Support/Stackdeck/log/php85-fpm.log
daemonize = no

[www]
listen = /Users/cyasitha/Library/Application Support/Stackdeck/run/php85.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes

php_admin_value[mysqli.default_socket] = /tmp/stackdeck.sock
php_admin_value[pdo_mysql.default_socket] = /tmp/stackdeck.sock
