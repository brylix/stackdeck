; Stackdeck FPM pool — PHP 8.3 (Laravel 10+)

[global]
pid = /Users/cyasitha/Library/Application Support/Stackdeck/run/php83-fpm.pid
error_log = /Users/cyasitha/Library/Application Support/Stackdeck/log/php83-fpm.log
daemonize = no

[www]
listen = /Users/cyasitha/Library/Application Support/Stackdeck/run/php83.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes

php_admin_value[mysqli.default_socket] = /tmp/stackdeck.sock
php_admin_value[pdo_mysql.default_socket] = /tmp/stackdeck.sock
