[workspace]
resolver = "2"
members = ["crates/supervisor", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
